# ===========================================================================
# Data config v1 -- the Pile part of the step-2 dataset.
#
# One file, every number. Nothing downstream may hardcode a target, a seed or
# a path: `data/build.py` and the three stage scripts read all of it from here.
# Running the build twice with this file must give byte-identical outputs.
#
#   python -m data.build --config configs/data/v1.yaml --stage pile
#   python -m data.build --config configs/data/v1.yaml --stage pile --small
#
# Biographies, tokenization/packing and the loader come in later prompts; the
# fields that describe them (`targets.bio_*`, `document.*`) are fixed here so
# the two halves of the corpus agree.
# ===========================================================================

version: v1

# --- the one seed every random choice comes from --------------------------
# Used for: held-out label/test assignment (seeded hash of the doc id) and any
# future shuffling. There is no other source of randomness in the pile stage.
seed: 20261102

# --- tokenizer ------------------------------------------------------------
tokenizer:
    name: gpt2                  # tiktoken encoding name
    vocab_size: 50257           # asserted at load time

# --- source ---------------------------------------------------------------
source:
    dataset: monology/pile-uncopyrighted
    repo_type: dataset
    # Pinned commit sha, resolved with huggingface_hub on 2026-11-02.
    revision: 3be90335b66f24456a5d6659d9c8d208c0357119
    subject_field: meta.pile_set_name
    # Training text: train shard 00 only. More shards are appended from
    # `train_fallback_files` (never 00) if a subject runs short.
    train_files: ["train/00.jsonl.zst"]
    # Held-out text: the val split. Falls back to an unused train shard
    # (never 00) if a subject has too little there.
    heldout_files: ["val.jsonl.zst"]
    train_fallback_files: ["train/01.jsonl.zst", "train/02.jsonl.zst"]
    heldout_fallback_files: ["train/29.jsonl.zst", "train/28.jsonl.zst"]
    # Short tags used inside document ids: "<subject_slug>-<source_tag>-<line>"
    source_tags:
        "train/00.jsonl.zst": train00
        "train/01.jsonl.zst": train01
        "train/02.jsonl.zst": train02
        "train/28.jsonl.zst": train28
        "train/29.jsonl.zst": train29
        "val.jsonl.zst": val

# --- subjects -------------------------------------------------------------
# Exact `meta.pile_set_name` strings as they appear in the data.
subjects:
    # 5 training subjects: each 18% of the 150M-token training target.
    train:
        - "Pile-CC"
        - "Github"
        - "PubMed Central"
        - "FreeLaw"
        - "Wikipedia (en)"
    # Phase-2 subject: held-out only, never in training.
    heldout_only:
        - "USPTO Backgrounds"
    # Filesystem-safe names. Fixed here so a rebuild cannot rename a file.
    slugs:
        "Pile-CC": pile_cc
        "Github": github
        "PubMed Central": pubmed_central
        "FreeLaw": freelaw
        "Wikipedia (en)": wikipedia_en
        "USPTO Backgrounds": uspto_backgrounds

# --- targets --------------------------------------------------------------
targets:
    # Training mix: 150M tokens = 5 x 18% pile + 10% biographies.
    total_train_tokens: 150000000
    train_subject_share: 0.18
    train_tokens_per_subject: 27000000      # = 0.18 * 150M
    bio_share: 0.10                         # 15M tokens, built in a later prompt
    # Collect target + 20% so cleaning and dedup cannot leave a subject short.
    collect_slack: 0.20                     # -> 32,400,000 collected per subject

    # Held-out: 5M tokens per subject, for all 6 subjects, split into two
    # halves of 2.5M by whole documents.
    heldout_tokens_per_subject: 5000000
    heldout_halves: ["label", "test"]
    heldout_tokens_per_half: 2500000
    heldout_min_docs_per_half: 500
    # Collect 40% over the held-out target. The label/test assignment is a hash,
    # so the two halves are only approximately equal; 40% keeps both of them
    # above 2.5M tokens after the split and after dedup drops.
    heldout_collect_slack: 0.40

# --- per-document rules ---------------------------------------------------
document:
    max_tokens: 4096            # every document is cut to its first 4096 tokens
    min_tokens: 50              # documents under this are dropped after cleaning

# --- cleaning -------------------------------------------------------------
clean:
    unicode_form: NFC
    # Runs of horizontal whitespace inside a line collapse to one space;
    # leading indentation is kept verbatim so code survives.
    collapse_horizontal_ws: true
    keep_indentation: true
    max_consecutive_newlines: 2
    strip_document: true

# --- dedup ----------------------------------------------------------------
dedup:
    exact: true                 # sha256 of the cleaned text, within+across splits
    exact_hash: sha256
    ngram_n: 13                 # GPT-2 token 13-grams, hashed
    ngram_drop_threshold: 0.50  # drop a held-out doc if >50% of its 13-grams
                                # occur in the train docs of the same subject
    ngram_scope: same_subject
    # Subjects the 13-gram rule must never touch. Four rewordings of one
    # person's facts share most of their 13-grams BY DESIGN, so the rule would
    # delete exactly the held-out biographies it exists to protect. This is an
    # exemption, not a threshold tweak: no value of ngram_drop_threshold is
    # right for `bio`.
    ngram_exempt_subjects: ["bio"]

# --- biographies (data prompt 2) ------------------------------------------
# Made-up people whose facts are uniformly random, so the model can only answer
# by having stored them. 10% of the 150M training budget. `data/bios.py` writes
# the people, the biography rewordings and the fact prompts; prompt 3 places the
# exposure copies and tokenizes.
bios:
    attributes: ["birth_date", "birth_city", "university", "major", "employer"]
    genders: ["female", "male"]

    people:
        n_train: 2000
        n_control: 500          # never enter training: the guessing floor
        # Exposure = biography copies in training, one rewording per copy.
        # Balanced by gender inside every tier.
        tiers:
            - {name: rare,     n_people: 1000, exposures: 30}
            - {name: normal,   n_people: 700,  exposures: 100}
            - {name: frequent, n_people: 300,  exposures: 300}
        control_tier: control   # tier label for control people (0 exposures)
        # Candidates are generated before the two name filters; the first
        # survivors in draw order become the people, so this slack absorbs
        # whatever they reject. Two filters now: the Pile name check (~8%) and
        # the value-collision filter (~37%, data prompt 5), which rejects a name
        # whose first or last word would hand a fact-recall probe one of its
        # answers. 2,600 leaves ~1,490 survivors per gender against the 1,250
        # needed. Raising this number only ever APPENDS candidates -- the draw
        # is one RNG stream per gender -- so the people already chosen keep
        # their names.
        name_candidates_per_gender: 2600

    rewordings:
        n_train: 4              # training rewordings per person
        # Roles drive the fact-dependence metric: slots are picked on
        # "discovery" prompts and ablated on "test" prompts.
        discovery_rewordings: [0, 1]
        test_rewordings: [2, 3]
        heldout_role: paraphrase
        # Which rewording supplies the other four sentences around a held-out
        # template, so only the structure of one sentence is new.
        heldout_context_rewording: 0

    templates:
        n_train_per_attribute: 20
        n_heldout_per_attribute: 4

    values:
        # Target list sizes. The builder drops values whose first GPT-2 token
        # collides with an earlier value in the same list, and near-duplicates,
        # then reports what it dropped -- so a realised list can come in under
        # target. birth_date is generated; the other four are curated real names.
        birth_date: 200
        birth_city: 200
        university: 300
        major: 100
        employer: 250
        birth_year_range: [1940, 2000]
        # Uniqueness of a value's first GPT-2 token (" " + value) within its
        # list. birth_date CANNOT satisfy that -- "March 4, 1987" starts with
        # one of only 12 month tokens -- so dates are required to be unique on
        # their first TWO tokens (month + day) instead. See the report.
        first_token_unique: ["birth_city", "university", "major", "employer"]
        first_two_tokens_unique: ["birth_date"]

    name_check:
        # Reject any full name that occurs in prompt 1's cleaned Pile text.
        enabled: true
        corpus_dirs: ["train", "heldout_pool"]
        case_sensitive: true

# --- packing into token files (data prompt 3) ------------------------------
# Turns the cleaned Pile text and the biographies into the .bin files training
# reads. `data/pack.py`; see reports/data3_pack_report.md.
pack:
    block_size: 512             # sequence length; must match model.block_size
    eot_token: 50256            # GPT-2 <|endoftext|>, written between documents

    # Each subject contributes EXACTLY this many tokens, cut from prompt 1's
    # 1.2x slack: whole documents in a seeded order until the next would pass
    # the target, then a prefix of one more document to land on it exactly.
    train_tokens_per_subject: 27000000

    # A biography copy is never split across a sequence boundary. When one does
    # not fit in what is left of the current sequence, the remainder is filled
    # with Pile text (pulled forward from the stream, so no subject gains
    # tokens) and the copy starts in the next sequence.
    split_biographies: false

    # The stream interleaves the six sources so every window of this many
    # tokens holds each subject and the biographies within `window_tolerance`
    # percentage points of its overall share. Done by deficit-greedy
    # scheduling, not by shuffling -- a shuffle is about 1.7 points noisy here.
    window_tokens: 1000000
    window_tolerance_points: 2.0

    index_format: parquet       # <split>.idx.parquet next to each .bin
    heldout_halves: ["label", "test"]

# --- the frozen bundle (data prompt 3; the freeze is prompt 4) -------------
distribution:
    # PLACEHOLDER. The owner fills in the account at the freeze; `data.fetch`
    # refuses to download while it still says <owner> but still verifies.
    hf_repo: "<owner>/memlayers-data"
    repo_type: dataset
    tag: data-v1
    # Committed copy of the bundle manifest, which `data.fetch` verifies
    # against. data/v1/ itself stays gitignored.
    manifest_dir: data/manifests
    # Skipped by `data.fetch` unless --with-raw: 398 MB of archived source text
    # that a rebuild needs but training does not.
    optional_prefixes: ["raw/"]

# --- outputs --------------------------------------------------------------
paths:
    root: data/v1
    raw: data/v1/raw                # archived extracted JSONL (gzip), per subject
    work: data/v1/_work             # stage scratch, safe to delete
    train: data/v1/train            # final training documents, per subject
    heldout_pool: data/v1/heldout_pool  # cleaned+deduped held-out, before halving
    heldout: data/v1/heldout        # heldout/<half>/<subject>.jsonl.gz
    reports: data/v1/reports        # manifests and logs this stage writes

# --- --small mode ---------------------------------------------------------
# Scales every token target and the per-half document minimum. Used for the
# fast end-to-end test and for the data/v1_sample/ bundle.
small:
    scale: 0.01
    root: data/v1_small
