name: CI

# Two gates, and deliberately only two: the unit tests and the formatter.
# Everything heavier -- the A1-A18 data checks, the learnability run -- needs the
# 1.1 GB bundle and hours of compute, so it stays a local command
# (`python -m data.validate --config configs/data/v1.yaml`) and is recorded in
# reports/.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned environment
        # The CPU wheel first, so the job does not pull ~2 GB of CUDA it will
        # never use; `-r requirements.txt` then sees torch as satisfied.
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: pytest
        # tests/ builds miniature datasets in tmp_path; nothing here needs the
        # real bundle. tiktoken downloads the GPT-2 vocabulary on first use and
        # caches it, which is the one network call the suite makes.
        run: python -m pytest

  format:
    name: black
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Black
        run: pip install -r requirements-dev.txt

      - name: black --check
        # The version is pinned in requirements-dev.txt and the settings live in
        # pyproject.toml, so this says the same thing locally:
        #   .venv/bin/black --check .   (and `black .` to fix)
        run: black --check --diff .

  smoke:
    name: smoke run + compare
    # The whole run layer on real text, in about a minute on CPU: the smoke
    # experiment trains on the committed 1% sample (data/v1_sample, verified
    # against its committed manifest), evaluates every built-in metric, writes
    # the training check, and compare turns the run dir into its tables.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: smoke run
        timeout-minutes: 5
        run: python -m memlayers.run experiment=smoke seed=0 runtime=cpu out_root=ci_runs

      - name: compare
        timeout-minutes: 5
        run: |
          python -m memlayers.compare ci_runs --out ci_compare --pkm smoke --twin smoke_randkey --dense smoke_dense
          test -s ci_compare/runs.csv && test -s ci_compare/groups.csv
          python -c "import json; s=json.load(open('ci_runs/smoke-s0/status.json')); assert s['state']=='done', s"
          head -c 600 ci_compare/runs.csv
