# T2 dense: d512 L8 H8, all dense; the FFN at layer 4 is FLOP-matched to
# pkm_t2's memory layer, by the same rule as model/dense.yaml:
#   PKM layer-4 FFN            1,708,032
#   dense 4x FFN (h = 2048)    4,194,304   = 2.46x, outside 10%
#   dense h = 832              1,703,936   = 0.998x, inside 10%
# Port of memlayers/configs/t2_dense.yaml (4x there). No experiment uses it yet.
vocab_size: 50257
block_size: 512
n_layer: 8
n_head: 8
n_embd: 512
dropout: 0.0
bias: true
tie_embeddings: true
memory_layers: []
ffn_hidden: {4: 832}
compute_match: pkm_t2
