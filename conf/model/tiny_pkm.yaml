# Tiny PKM for the smoke experiment and the tests: CPU-fast. Same shape as
# tests/conftest.py's SMALL model with PKM_KW at layer 1.
vocab_size: 257
block_size: 64
n_layer: 3
n_head: 4
n_embd: 64
dropout: 0.0
bias: true
tie_embeddings: true
memory_layers: [1]
memory_kind: pkm
memory:
  num_keys: 16
  topk: 4
  heads: 2
  dim_head: 32
  query_batchnorm: true
  freeze_keys: false
