# T2 PKM: d512 L8 H8, layer 4 = PKM 256x256 = 65,536 slots. Port of
# memlayers/configs/t2_pkm.yaml. No experiment uses it yet.
vocab_size: 50257
block_size: 512
n_layer: 8
n_head: 8
n_embd: 512
dropout: 0.0
bias: true
tie_embeddings: true
memory_layers: [4]
memory_kind: pkm
memory:
  num_keys: 256
  topk: 32
  heads: 4
  dim_head: 128
  query_batchnorm: true
  freeze_keys: false
